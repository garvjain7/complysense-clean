services:
  - type: web
    name: complysense-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: complysense
      - key: MONGODB_DOCUMENTS_COLLECTION
        value: documents
      - key: MONGODB_CONTROL_LIBRARY_COLLECTION
        value: control_library
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_KNOWLEDGE_BUCKET
        value: knowledge-base
      - key: SECRET_KEY
        sync: false
      - key: REFRESH_COOKIE_SECURE
        value: true
      - key: REFRESH_COOKIE_SAMESITE
        value: none
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_ADMIN_REINDEX_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  - type: web
    name: complysense-ai
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn ai_service.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-2.5-flash-lite
      - key: MAIN_API_URL
        sync: false
      - key: ADMIN_REINDEX_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: complysense
      - key: MONGODB_DOCUMENTS_COLLECTION
        value: documents
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_KNOWLEDGE_BUCKET
        value: knowledge-base

  - type: web
    name: complysense-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
